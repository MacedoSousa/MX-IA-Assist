server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

spring:

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mx}
    username: ${SPRING_DATASOURCE_USERNAME:mx}
    password: ${SPRING_DATASOURCE_PASSWORD:mx_dev_password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  sql:
    init:
      mode: never

auth:
  refresh-expiration-ms: ${AUTH_REFRESH_EXPIRATION_MS:2592000000}

security:
  cors:
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:8082,http://localhost:19006,https://mx-ai.taila61bd3.ts.net}
    # Somente sub-redes privadas explícitas; use SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS para sua LAN.
    allowed-origin-patterns: ${SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS:}

mx:
  ollama:

    url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen3:8b}
    timeout-ms: ${OLLAMA_TIMEOUT_MS:120000}
  workspace:
    root: ${MX_WORKSPACE_ROOT:.}
    max-entries: ${MX_WORKSPACE_MAX_ENTRIES:500}
    max-depth: ${MX_WORKSPACE_MAX_DEPTH:4}
    max-read-bytes: ${MX_WORKSPACE_MAX_READ_BYTES:1048576}
    max-write-bytes: ${MX_WORKSPACE_MAX_WRITE_BYTES:1048576}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
