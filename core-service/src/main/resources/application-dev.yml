server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

# Persist the application lifecycle and failure evidence in the mounted /app/logs directory.
logging:
  file:
    name: ${MX_LOG_FILE:/app/logs/mx-core.log}
  logback:
    rollingpolicy:
      max-file-size: ${MX_LOG_MAX_FILE_SIZE:20MB}
      max-history: ${MX_LOG_MAX_HISTORY:14}
      total-size-cap: ${MX_LOG_TOTAL_SIZE_CAP:500MB}

spring:

  servlet:
    multipart:
      max-file-size: ${MX_ATTACHMENTS_MAX_BYTES:26214400}
      max-request-size: ${MX_ATTACHMENTS_MAX_BYTES:26214400}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mx}
    username: ${SPRING_DATASOURCE_USERNAME:mx}
    password: ${SPRING_DATASOURCE_PASSWORD:mx_dev_password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  sql:
    init:
      mode: never

auth:
  refresh-expiration-ms: ${AUTH_REFRESH_EXPIRATION_MS:2592000000}

security:
  cors:
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:8082,http://localhost:19006,https://mx-ai.taila61bd3.ts.net}
    # Somente sub-redes privadas explícitas; use SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS para sua LAN.
    allowed-origin-patterns: ${SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS:}

mx:
  ollama:

    url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:deepseek-r1:14b}
    # Gemma 4 E4B handles text, image and audio inputs locally; pull it before multimodal use.
    vision-model: ${OLLAMA_VISION_MODEL:gemma4:e4b}
    timeout-ms: ${OLLAMA_TIMEOUT_MS:300000}
    keep-alive: ${OLLAMA_KEEP_ALIVE:1h}
    fast-casual: ${OLLAMA_FAST_CASUAL:true}
    warmup-enabled: ${OLLAMA_WARMUP_ENABLED:true}
    num-ctx: ${OLLAMA_NUM_CTX:8192}
    num-thread: ${OLLAMA_NUM_THREAD:0}
  media:
    image-generation:
      enabled: ${MX_IMAGE_GENERATION_ENABLED:false}
      url: ${MX_IMAGE_GENERATION_URL:http://host.docker.internal:7860}
      max-pixels: ${MX_IMAGE_GENERATION_MAX_PIXELS:1048576}
      steps: ${MX_IMAGE_GENERATION_STEPS:24}
    video-generation:
      enabled: ${MX_VIDEO_GENERATION_ENABLED:true}
      ffmpeg-command: ${MX_VIDEO_GENERATION_FFMPEG_COMMAND:ffmpeg}
      max-duration-seconds: ${MX_VIDEO_GENERATION_MAX_DURATION_SECONDS:30}
      max-pixels: ${MX_VIDEO_GENERATION_MAX_PIXELS:2073600}
      frames-per-second: ${MX_VIDEO_GENERATION_FRAMES_PER_SECOND:24}
      timeout-seconds: ${MX_VIDEO_GENERATION_TIMEOUT_SECONDS:180}
    audio-transcription:
      enabled: ${MX_AUDIO_TRANSCRIPTION_ENABLED:false}
      command: ${MX_AUDIO_TRANSCRIPTION_COMMAND:whisper}
      model: ${MX_AUDIO_TRANSCRIPTION_MODEL:base}
      timeout-seconds: ${MX_AUDIO_TRANSCRIPTION_TIMEOUT_SECONDS:300}
      max-chars: ${MX_AUDIO_TRANSCRIPTION_MAX_CHARS:50000}
  attachments:
    root: ${MX_ATTACHMENTS_ROOT:./workspace/attachments}
    max-bytes: ${MX_ATTACHMENTS_MAX_BYTES:26214400}
    max-text-bytes: ${MX_ATTACHMENTS_MAX_TEXT_BYTES:262144}
    max-vision-bytes: ${MX_ATTACHMENTS_MAX_VISION_BYTES:5242880}
  self-analysis:
    # Ativo no perfil local porque o usuário solicitou busca em tempo real; desligue via variável de ambiente.
    external-search-enabled: ${MX_SELF_ANALYSIS_EXTERNAL_SEARCH_ENABLED:true}
    search-endpoint: ${MX_SELF_ANALYSIS_SEARCH_ENDPOINT:https://api.duckduckgo.com}
    max-results: ${MX_SELF_ANALYSIS_MAX_RESULTS:3}
    audit-path: ${MX_SELF_ANALYSIS_AUDIT_PATH:/app/workspace/knowledge/runtime/self-analysis.jsonl}
  workspace:
    root: ${MX_WORKSPACE_ROOT:.}
    max-entries: ${MX_WORKSPACE_MAX_ENTRIES:500}
    max-depth: ${MX_WORKSPACE_MAX_DEPTH:4}
    max-read-bytes: ${MX_WORKSPACE_MAX_READ_BYTES:1048576}
    max-write-bytes: ${MX_WORKSPACE_MAX_WRITE_BYTES:1048576}
  evolution:
    root: ${MX_EVOLUTION_ROOT:/app/workspace/evolution}
    max-files: ${MX_EVOLUTION_MAX_FILES:20}
    max-file-bytes: ${MX_EVOLUTION_MAX_FILE_BYTES:262144}
    max-total-bytes: ${MX_EVOLUTION_MAX_TOTAL_BYTES:1048576}
    allow-push-requests: ${MX_EVOLUTION_ALLOW_PUSH_REQUESTS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
