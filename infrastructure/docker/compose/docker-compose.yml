services:

  postgres:
    image: postgres:16
    container_name: mx-postgres
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - ../env/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mx}
      POSTGRES_USER: ${POSTGRES_USER:-mx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mx_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - ../../../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: mx-redis
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - ../../../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: mx-ollama
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:11434:11434"
    # Use the single NVIDIA GPU when Docker Desktop exposes WSL2 GPU-PV.
    # The service remains CPU-capable if the host is started without GPU support.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ../../../data/ollama:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # One concurrent generation protects 8 GB VRAM when using 14B profiles.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1h}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-64}
      OLLAMA_LOAD_TIMEOUT: ${OLLAMA_LOAD_TIMEOUT:-10m}
      OLLAMA_NO_CLOUD: ${OLLAMA_NO_CLOUD:-1}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: mx-open-webui
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      - ollama
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ../../../data/open-webui:/app/backend/data

  image-engine:
    image: ghcr.io/ai-dock/stable-diffusion-webui-forge:v2-cuda-12.1.1-base-22.04
    container_name: mx-image-engine
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${MX_IMAGE_ENGINE_PORT:-7860}:7860"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      WORKSPACE: /workspace
      FORGE_PORT_HOST: 7860
      FORGE_PORT_LOCAL: 17860
      FORGE_ARGS: ${MX_IMAGE_ENGINE_ARGS:---api --listen}
      WEB_ENABLE_AUTH: ${MX_IMAGE_ENGINE_WEB_AUTH:-false}
      AUTO_UPDATE: ${MX_IMAGE_ENGINE_AUTO_UPDATE:-false}
    volumes:
      - ../../../data/image-engine:/workspace
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7860/sdapi/v1/sd-models >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  dsh:
    build:
      context: ../dsh
      dockerfile: Dockerfile
      args:
        DSH_VERSION: ${DSH_VERSION:-0.1.0-rc.8}
    image: mx-dsh:latest
    container_name: mx-dsh
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      - ollama
    ports:
      - "${MX_DSH_BIND:-127.0.0.1}:${MX_DSH_PORT:-3080}:3080"
    environment:
      DSH_HOME: /root/.dsh
    volumes:
      - ../../../:/workspace/mx
      - ../../../data/dsh:/root/.dsh
      - ../dsh/settings.yaml:/root/.dsh/settings.yaml:ro
    working_dir: /workspace/mx
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const net=require('net');const socket=net.connect(3080,'127.0.0.1');socket.setTimeout(3000);socket.on('connect',()=>{socket.end();process.exit(0)});socket.on('error',()=>process.exit(1));socket.on('timeout',()=>process.exit(1));\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

  mx-core:
    build:
      context: ../../../core-service
      dockerfile: Dockerfile
    image: mx-core:latest
    container_name: mx-core
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mx
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mx}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mx_dev_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      OLLAMA_URL: http://ollama:11434
      # Quality-first default: DeepSeek R1 14B is the strongest installed text-reasoning profile.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-r1:14b}
      MX_OLLAMA_TIMEOUT_MS: ${MX_OLLAMA_TIMEOUT_MS:-300000}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1h}
      OLLAMA_FAST_CASUAL: ${OLLAMA_FAST_CASUAL:-true}
      OLLAMA_WARMUP_ENABLED: ${OLLAMA_WARMUP_ENABLED:-true}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-gemma4:e4b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-0}
      MX_ATTACHMENTS_ROOT: /app/workspace/attachments
      MX_ATTACHMENTS_MAX_BYTES: ${MX_ATTACHMENTS_MAX_BYTES:-26214400}
      MX_ATTACHMENTS_MAX_TEXT_BYTES: ${MX_ATTACHMENTS_MAX_TEXT_BYTES:-262144}
      MX_ATTACHMENTS_MAX_VISION_BYTES: ${MX_ATTACHMENTS_MAX_VISION_BYTES:-5242880}
      MX_MEDIA_IMAGEGENERATION_ENABLED: ${MX_MEDIA_IMAGEGENERATION_ENABLED:-true}
      MX_MEDIA_IMAGEGENERATION_URL: ${MX_MEDIA_IMAGEGENERATION_URL:-http://image-engine:17860}
      MX_MEDIA_IMAGEGENERATION_MAXPIXELS: ${MX_MEDIA_IMAGEGENERATION_MAXPIXELS:-1048576}
      MX_MEDIA_IMAGEGENERATION_STEPS: ${MX_MEDIA_IMAGEGENERATION_STEPS:-24}
      MX_DOCUMENT_GENERATION_ENABLED: ${MX_DOCUMENT_GENERATION_ENABLED:-true}
      MX_AUDIO_TRANSCRIPTION_ENABLED: ${MX_AUDIO_TRANSCRIPTION_ENABLED:-false}
      MX_AUDIO_TRANSCRIPTION_COMMAND: ${MX_AUDIO_TRANSCRIPTION_COMMAND:-whisper}
      MX_AUDIO_TRANSCRIPTION_MODEL: ${MX_AUDIO_TRANSCRIPTION_MODEL:-base}
      MX_AUDIO_TRANSCRIPTION_TIMEOUT_SECONDS: ${MX_AUDIO_TRANSCRIPTION_TIMEOUT_SECONDS:-300}
      MX_AUDIO_TRANSCRIPTION_MAX_CHARS: ${MX_AUDIO_TRANSCRIPTION_MAX_CHARS:-50000}
      MX_SELF_ANALYSIS_EXTERNAL_SEARCH_ENABLED: ${MX_SELF_ANALYSIS_EXTERNAL_SEARCH_ENABLED:-true}
      MX_SELF_ANALYSIS_SEARCH_ENDPOINT: ${MX_SELF_ANALYSIS_SEARCH_ENDPOINT:-https://api.duckduckgo.com}
      MX_SELF_ANALYSIS_MAX_RESULTS: ${MX_SELF_ANALYSIS_MAX_RESULTS:-3}
      MX_SELF_ANALYSIS_AUDIT_PATH: /app/workspace/knowledge/runtime/self-analysis.jsonl
      MX_EVOLUTION_ROOT: /app/workspace/evolution
      MX_EVOLUTION_MAX_FILES: ${MX_EVOLUTION_MAX_FILES:-20}
      MX_EVOLUTION_MAX_FILE_BYTES: ${MX_EVOLUTION_MAX_FILE_BYTES:-262144}
      MX_EVOLUTION_MAX_TOTAL_BYTES: ${MX_EVOLUTION_MAX_TOTAL_BYTES:-1048576}
      MX_EVOLUTION_ALLOW_PUSH_REQUESTS: ${MX_EVOLUTION_ALLOW_PUSH_REQUESTS:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ../../../logs:/app/logs
      - ../../../data/attachments:/app/workspace/attachments
      - ../../../data/knowledge:/app/workspace/knowledge
      - ../../../data/evolution:/app/workspace/evolution

  mx-web:
    build:
      context: ../../../clients/mx-app
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_MX_API_URL: ${EXPO_PUBLIC_MX_API_URL:-}
    image: mx-web:latest
    container_name: mx-web
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      mx-core:
        condition: service_healthy
    ports:
      - "${MX_WEB_PORT:-8082}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  open-webui_data:
