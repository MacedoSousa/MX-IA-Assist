services:

  ollama:
    image: ollama/ollama:latest
    container_name: mx-ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

    volumes:
      - ollama_data:/root/.ollama


  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: mx-open-webui
    restart: unless-stopped

    depends_on:
      - ollama

    ports:
      - "3000:8080"

    environment:
      OLLAMA_BASE_URL: http://ollama:11434

    volumes:
      - ../../../data/open-webui:/app/backend/data


  postgres:
    image: postgres:16
    container_name: mx-postgres
    restart: unless-stopped

    env_file:
      - ../env/.env

    ports:
      - "5432:5432"

    volumes:
      - ../../../data/postgres:/var/lib/postgresql/data


  redis:
    image: redis:7
    container_name: mx-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - ../../../data/redis:/data

  mx-core:
    image: mx-core:latest
    container_name: mx-core
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - ollama
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mx
      DB_USER: mx
      DB_PASSWORD: mx_dev_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_URL: http://ollama:11434


volumes:

  ollama_data: